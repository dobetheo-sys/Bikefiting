# Site : https://dobetheo-sys.github.io/Bikefiting/
#
# Publie sur la branche gh-pages (méthode "classique", un simple git push) plutôt
# que via l'API "GitHub Pages Deployments" (actions/deploy-pages) : cette dernière
# est restée bloquée en "in progress" pendant plus de 20 minutes lors de la mise en
# place initiale (déploiement fantôme créé avant l'activation de Pages, jamais
# nettoyé côté plateforme). Cette méthode ne dépend pas de cette API.
#
# Réglage requis une seule fois côté GitHub : Settings > Pages > Build and
# deployment > Source = "Deploy from a branch", branche gh-pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/analyse-github-ofvrqz, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
